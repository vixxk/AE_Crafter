<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1822" />
      <stop offset="100%" stop-color="#0c0a0e" />
    </linearGradient>
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.05" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle neon pink stroke -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#pinkGlow)" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Blueprint base grid (isometric dashed lines) -->
  <g stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.28" stroke-dasharray="2 2">
    <line x1="12" y1="44" x2="32" y2="55.5" />
    <line x1="32" y1="55.5" x2="52" y2="44" />
    <line x1="8" y1="41.5" x2="32" y2="55.5" />
    <line x1="32" y1="55.5" x2="56" y2="41.5" />
  </g>

  <!-- Isometric Architectural Structure -->
  <g filter="url(#softGlow)">
    <!-- Top Roof / Slab -->
    <polygon points="32,10 49,20 32,30 15,20" fill="url(#topFacet)" stroke="url(#pinkGlow)" stroke-width="2" stroke-linejoin="round" />

    <!-- Left Wall / Facet -->
    <polygon points="15,20 32,30 32,48 15,38" fill="url(#leftFacet)" stroke="url(#pinkGlow)" stroke-width="2" stroke-linejoin="round" />

    <!-- Right Wall / Facet -->
    <polygon points="49,20 32,30 32,48 49,38" fill="url(#rightFacet)" stroke="url(#pinkGlow)" stroke-width="2" stroke-linejoin="round" />

    <!-- Center Isometric Edge Highlight -->
    <line x1="32" y1="30" x2="32" y2="48" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.75" />

    <!-- Architectural room divider interior glass wirelines -->
    <line x1="23.5" y1="25" x2="23.5" y2="43" stroke="#f472b6" stroke-width="1" stroke-opacity="0.5" />
    <line x1="40.5" y1="25" x2="40.5" y2="43" stroke="#f472b6" stroke-width="1" stroke-opacity="0.5" />
    <line x1="32" y1="10" x2="32" y2="21" stroke="#f472b6" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="1.5 1.5" />
    <line x1="23.5" y1="15" x2="40.5" y2="25" stroke="#f472b6" stroke-width="0.8" stroke-opacity="0.4" />

    <!-- Floor Plan Entry Door Cutout Notch -->
    <line x1="20" y1="35" x2="27" y2="39" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />
  </g>

  <!-- Glowing architectural corner node points -->
  <circle cx="32" cy="10" r="1.6" fill="#ffffff" />
  <circle cx="15" cy="20" r="1.4" fill="#f472b6" />
  <circle cx="49" cy="20" r="1.4" fill="#f472b6" />
  <circle cx="32" cy="30" r="1.6" fill="#ffffff" />
  <circle cx="32" cy="48" r="1.6" fill="#ffffff" />
</svg>