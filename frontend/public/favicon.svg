<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f18" />
      <stop offset="100%" stop-color="#060d0a" />
    </linearGradient>
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.05" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle neon emerald stroke -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#greenGlow)" stroke-width="1.8" stroke-opacity="0.65" />

  <!-- Blueprint base grid (isometric dashed lines) -->
  <g stroke="#34d399" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2 2">
    <line x1="12" y1="44" x2="32" y2="55.5" />
    <line x1="32" y1="55.5" x2="52" y2="44" />
    <line x1="8" y1="41.5" x2="32" y2="55.5" />
    <line x1="32" y1="55.5" x2="56" y2="41.5" />
  </g>

  <!-- Isometric Architectural Structure -->
  <g filter="url(#softGlow)">
    <!-- Top Roof / Slab -->
    <polygon points="32,10 49,20 32,30 15,20" fill="url(#topFacet)" stroke="url(#greenGlow)" stroke-width="2" stroke-linejoin="round" />

    <!-- Left Wall / Facet -->
    <polygon points="15,20 32,30 32,48 15,38" fill="url(#leftFacet)" stroke="url(#greenGlow)" stroke-width="2" stroke-linejoin="round" />

    <!-- Right Wall / Facet -->
    <polygon points="49,20 32,30 32,48 49,38" fill="url(#rightFacet)" stroke="url(#greenGlow)" stroke-width="2" stroke-linejoin="round" />

    <!-- Center Isometric Edge Highlight -->
    <line x1="32" y1="30" x2="32" y2="48" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Architectural room divider interior glass wirelines -->
    <line x1="23.5" y1="25" x2="23.5" y2="43" stroke="#34d399" stroke-width="1" stroke-opacity="0.55" />
    <line x1="40.5" y1="25" x2="40.5" y2="43" stroke="#34d399" stroke-width="1" stroke-opacity="0.55" />
    <line x1="32" y1="10" x2="32" y2="21" stroke="#34d399" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="1.5 1.5" />
    <line x1="23.5" y1="15" x2="40.5" y2="25" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.45" />

    <!-- Floor Plan Entry Door Cutout Notch -->
    <line x1="20" y1="35" x2="27" y2="39" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />
  </g>

  <!-- Glowing architectural corner node points -->
  <circle cx="32" cy="10" r="1.6" fill="#ffffff" />
  <circle cx="15" cy="20" r="1.4" fill="#34d399" />
  <circle cx="49" cy="20" r="1.4" fill="#34d399" />
  <circle cx="32" cy="30" r="1.6" fill="#ffffff" />
  <circle cx="32" cy="48" r="1.6" fill="#ffffff" />
</svg>